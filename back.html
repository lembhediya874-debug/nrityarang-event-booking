<h1>Book Your Tickets</h1>
    
    <div id="event-info">
        <p>Loading event details...</p>
    </div>

    <form id="booking-form">
        <label>Name:</label>
        <input type="text" id="name" required><br><br>

        <label>Email:</label>
        <input type="email" id="email" required><br><br>

        <label>Phone:</label>
        <input type="tel" id="phone" required><br><br>

        <label>Number of Tickets:</label>
        <input type="number" id="tickets" min="1" required><br><br>

        <button type="submit">Book Now</button>
    </form>

    <p id="message-box"></p>
<!--new codee-->
<script>
/*new code*/
  const BACKEND_URL = 'https://sail-bought-sealed-villas.trycloudflare.com'; 

        async function loadEventDetails() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/event`);
                const eventData = await response.json();
                
                document.getElementById('event-info').innerHTML = `
                    <h2>${eventData.name}</h2>
                    <p>Price per ticket: ₹${eventData.ticket_price}</p>
                    <p>Seats Available: <strong>${eventData.available_seats}</strong></p>
                `;
            } catch (error) {
                console.error("Error fetching event:", error);
                document.getElementById('event-info').innerHTML = "<p>Failed to load event details.</p>";
            }
        }

        document.getElementById('booking-form').addEventListener('submit', async function(e) {
            e.preventDefault(); 
            
            const messageBox = document.getElementById('message-box');
            messageBox.style.color = "blue";
            messageBox.innerText = "Processing booking...";

            const bookingData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                tickets_requested: parseInt(document.getElementById('tickets').value)
            };

            try {
                const response = await fetch(`${BACKEND_URL}/api/book`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bookingData)
                });

                const result = await response.json();

                if (response.ok) {
                    messageBox.style.color = "green";
                    messageBox.innerText = `Success! You paid ₹${result.booking.total_paid}.`;
                    loadEventDetails();
                    document.getElementById('booking-form').reset(); 
                } else {
                    messageBox.style.color = "red";
                    messageBox.innerText = `Error: ${result.error}`;
                }
            } catch (error) {
                console.error("Error booking ticket:", error);
                messageBox.style.color = "red";
                messageBox.innerText = "Failed to connect to the server.";
            }
        });

        loadEventDetails();
/*new*/
</script>
