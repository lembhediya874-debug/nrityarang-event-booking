<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>payment details page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<style>
  .header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:#1b1b1b;
      color:white;
      padding:15px;
      border-bottom:1px solid #444;
    }

    .logo{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .logo i{
      color:#0a84ff;
      font-size:24px;
    }

    .main-container{
      width: 90%;
      max-width: 700px;
      margin: 20px auto;
      border: 1px solid #4a4a4a;
      border-radius:25px ;
      overflow: hidden;
      background: #1f1f1f;
    }

    .hero{
      text-align: center;
      padding: 0px;
      margin: 0;
      color: white;
    }

    button{
      width:100%;
      padding:18px;
      background:#0d47a1;
      border:none;
      border-radius:12px;
      color:white;
      font-size:22px;
      cursor:pointer;
      margin-top:20px;
      transition: 0.3s;
    }

    button:hover{
      background-color:deepskyblue;
    }

    footer{
      text-align:center;
      padding:25px;
      border-top:1px solid #555;
      margin-top:20px;
    } 

</style>

<body>
    <div class="main-container">

      <header class="header">

        <div class="logo">
          <i class="fa-solid fa-ticket"></i>
        <h4>ticket booking website</h4>
        </div>
        
      <i class="fa-solid fa-bars menu"></i>
    </header>

    <section class="hero">
        <h1>Payment details</h1>
    </section>

    <a href="bookedticket.html">
        <button>
            Get Ticket
        </button>
    </a>

    
    <footer>

    </footer>

    </div>
</body>

</html>
