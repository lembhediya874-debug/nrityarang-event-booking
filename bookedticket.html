<!DOCTYPE html>
<html lang="en">
    
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Ticket</title>
</head>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.ticket{
    width:360px;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 0 20px rgba(0,0,0,.4);
}

.top{
    background:#6a0dad;
    color:white;
    text-align:center;
    padding:20px;
}

.top h2{
    margin-bottom:5px;
}

.details{
    padding:20px;
}

.row{
    display:flex;
    justify-content:space-between;
    margin:12px 0;
    border-bottom:1px dashed #ccc;
    padding-bottom:8px;
}

.label{
    font-weight:bold;
    color:#555;
}

.value{
    color:#000;
}

.qr{
    text-align:center;
    margin:20px 0;
}

.qr img{
    width:130px;
    height:130px;
}

.booking{
    text-align:center;
    font-weight:bold;
    color:#6a0dad;
    margin-bottom:15px;
}

button{
    width:90%;
    margin:15px auto;
    display:block;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#6a0dad;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#520b8a;
}
</style>

<body>

<div class="ticket">

<div class="top">
<h2>Nrityanand Kathak vidyalay</h2>
<p>Booking Confirmed ✅</p>
</div>

<div class="details">

<div class="booking">
    Booking ID : <span id="bookingId">-</span>
</div>

<div class="row">
    <span class="label">Name</span>
    <span class="value" id="ticketName"></span>
</div>

<div class="row">
<span class="label">Date</span>
<span class="value">6 semptember 2026</span>
</div>

<div class="row">
<span class="label">Time</span>
<span class="value">7:00 PM</span>
</div>

<div class="row">
<span class="label">Hall</span>
<span class="value"> Prabodhankar Thackeray auditorium</span><br/>
</div>

<div class="row">
    <span class="label">Seat</span>
    <span class="value" id="ticketSeats"></span>
</div>

<div class="row">
    <span class="label">Phone</span>
    <span class="value" id="ticketPhone"></span>
</div>

<div class="row">
    <span class="label">Alternate Phone</span>
    <span class="value" id="ticketAltPhone"></span>
</div>

<div class="row">
    <span class="label">Branch</span>
    <span class="value" id="ticketBranch"></span>
</div>

<div class="row">
    <span class="label">Amount</span>
    <span class="value" id="ticketAmount"></span>
</div>

<!--<div class="row">
<span class="label">Amount</span>
<span class="value">₹1000</span>
</div>-->

<div class="qr">
    <img id="ticketQR" src="" alt="QR Code">
</div>

<button onclick="window.print()">Print Ticket</button>

</div>

</div>

<script>

const savedData = localStorage.getItem("ticketData");

if (!savedData) {

    alert("Ticket information not found.");
    
} else {

    const ticket = JSON.parse(savedData);

    // -----------------------------
    // DISPLAY TICKET DETAILS
    // -----------------------------

    document.getElementById("bookingId").textContent =
        ticket.bookingId;

    document.getElementById("ticketName").textContent =
        ticket.name;

    document.getElementById("ticketSeats").textContent =
        ticket.seats.join(", ");

    document.getElementById("ticketPhone").textContent =
        ticket.phone;

    document.getElementById("ticketAltPhone").textContent =
        ticket.altPhone;

    document.getElementById("ticketBranch").textContent =
        ticket.branch;

    document.getElementById("ticketAmount").textContent =
        "₹" + Number(ticket.total).toLocaleString("en-IN");


    // -----------------------------
    // CREATE QR DATA
    // -----------------------------

    const qrData = `
Nrityanand Kathak Vidyalay

Booking ID: ${ticket.bookingId}

Name: ${ticket.name}

Seats: ${ticket.seats.join(", ")}

Phone: ${ticket.phone}

Alternate Phone: ${ticket.altPhone}

Branch: ${ticket.branch}

Date: 6 September 2026

Time: 7:00 PM

Hall: Prabodhankar Thackeray Auditorium

Amount: ₹${Number(ticket.total).toLocaleString("en-IN")}
`;


    // -----------------------------
    // GENERATE QR CODE
    // -----------------------------

    const qrURL =
        "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data="
        + encodeURIComponent(qrData);

    document.getElementById("ticketQR").src = qrURL;

}

</script>

</body>
</html>
