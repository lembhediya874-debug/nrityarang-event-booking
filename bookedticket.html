<!DOCTYPE html>
<html lang="en">
    
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Ticket</title>
</head>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;

    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
}

body {
    min-height: 500px;
    background: #1f1f1f;
    font-family: Arial, sans-serif;
    color: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 27px 12px;
}

.ticket-container {
    width: 90%;
    max-width: 430px;
    background: white;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.45);
}

.ticket-header {
    background: linear-gradient(
        135deg,
        #7b2cbf,
        #f24e6c
    );
    color: white;
    text-align: center;
    padding: 25px 18px 22px;
}

.ticket-header h1 {
    font-size: 24px;
    font-weight: 500;
    margin-bottom: 6px;
}

.booking-status {
    font-size: 14px;
    font-weight: 400;
}

.booking-status span {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    margin-left: 5px;
    background: #25c77a;
    border-radius: 50%;
    font-size: 14px;
}

.booking-id {
    text-align: center;
    color: #7b2cbf;
    font-size: 19px;
    font-weight: 600;
    padding: 22px 20px 10px;
}

.ticket-details {
    padding: 5px 40px 10px;
}

.detail-row {
    display: flex;
    align-items: center;
    min-height: 45px;
    border-bottom: 1px dashed #cfcfcf;
    font-size: 17px;
}

.detail-row:last-child {
    border-bottom: none;
}

.detail-label {
    width: 80px;
    padding-left: 5px;
    font-weight: 700;
    color: #555;
}

.detail-value {
    flex: 1;
    padding-right: 5px;
    text-align: right;
    color: #111;
    line-height: 1.4;
}

.amount-row {
    margin-top: 3px;
    padding-top: 6px;
}

.amount-row .detail-label {
    color: #7b2cbf;
}

.amount-row .detail-value {
    color: #7b2cbf;
    font-size: 19px;
    font-weight: 700;
}

.qr {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px 0 20px;
}

.qr img {
    width: 150px;
    height: 150px;
    object-fit: contain;
    border: 8px solid white;
    border-radius: 12px;
    box-shadow: 0 3px 15px rgba(0, 0, 0, 0.15);
}

.qr-text {
    margin-top: 8px;
    color: #666;
    font-size: 13px;
}

.button-section {
    width: 100%;
    text-align: center;
    padding: 10px 20px 35px;
}

.print-btn {
    display: block;
    width: 350px;
    margin: 0 auto;
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    background: #7b2cbf;
    color: white;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.25s ease;
}

.print-btn:hover {
    background: #f24e6c;
    transform: translateY(-2px);
}

@media (max-width: 600px) {

    body {
        padding: 15px 10px;
    }

    .ticket-container {
        border-radius: 18px;
    }

    .ticket-header {
        padding: 24px 15px;
    }

    .ticket-header h1 {
        font-size: 23px;
    }

    .booking-status {
        font-size: 16px;
    }

    .ticket-details {
        padding: 5px 20px;
    }

    .detail-row {
        font-size: 15px;
        min-height: 50px;
    }

    .detail-label {
        width: 80px;
    }

    .detail-value {
        font-size: 15px;
    }

  .button-section {
        width: 100%;
        text-align: center;
        padding: 15px 20px 25px;
    }

    .print-btn {
        width: 220px;
    }

    .qr img {
        width: 130px;
        height: 130px;
    }
}

@media print {
    *{
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }

    body {
        background: white;
        padding: 0;
    }

    .ticket-container {
        max-width: 650px;
        box-shadow: none;
        border: 1px solid #ddd;
    }

    .ticket-header {
        background: linear-gradient(
            135deg,
            #7b2cbf,
            #f24e6c
        ) !important;

        color: white !important;
    }

      .booking-id {
        color: #7b2cbf !important;
    }

    .amount-row .detail-label,
    .amount-row .detail-value {
        color: #7b2cbf !important;
    }

    .print-btn {
        display: none;
    }

}

#confetti-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 9999;
}

.confetti {
    position: absolute;
    top: -20px;
    width: 9px;
    height: 16px;
    border-radius: 2px;
    animation: fall 4s linear forwards;
}

#confetti-container {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
    z-index: 9999;
}

.confetti-piece {
    position: absolute;
    width: 8px;
    height: 14px;
    border-radius: 2px;
    opacity: 0;
    animation: confetti-burst 2.8s ease-out forwards;
}

/* LEFT + RIGHT BURST */
.confetti-piece.left {
    left: 0;
}

.confetti-piece.right {
    right: 0;
}

/* ANIMATION */

@keyframes confetti-burst {

    0% {
        opacity: 1;

        transform:
            translate(0, 0)
            rotate(0deg);
    }

    25% {
        opacity: 1;
    }

    100% {
        opacity: 0;

        transform:
            translate(var(--x), var(--y))
            rotate(var(--rotation));
    }
}

</style>

<body>
    <!-- CONFETTI BURST -->
<div id="confetti-container"></div>

<div class="ticket-container">

<div class="ticket-header">
    <h2>Nrityanand Kathak Vidyalaya</h2>
        <div class="booking-status">
        <p>Booking Confirmed ✅</p>
        </div>
</div>

<div class="details">

<div class="booking-id">
    Booking ID : <span id="bookingId">-</span>
</div>

<div class="detail-row">
    <span class="detail-label">Name</span>
    <span class="detail-value" id="ticketName"></span>
</div>

<div class="detail-row">
<span class="detail-label">Date</span>
<span class="detail-value">6 september 2026</span>
</div>

<div class="detail-row">
<span class="detail-label">Time</span>
<span class="detail-value">7:00 PM</span>
</div>

<div class="detail-row">
<span class="detail-label">Hall</span>
<span class="detail-value"> Prabodhankar Thackeray auditorium</span><br/>
</div>

<div class="detail-row">
    <span class="detail-label">Seat</span>
    <span class="detail-value" id="ticketSeats"></span>
</div>

<div class="detail-row">
    <span class="detail-label">Branch</span>
    <span class="detail-value" id="ticketBranch"></span>
</div>

<div class="detail-row">
    <span class="detail-label">Amount</span>
    <span class="detail-value" id="ticketAmount"></span>
</div>

<div class="qr">
    <img id="ticketQR" src="" alt="QR Code">
</div>

<button class="print-btn" onclick="window.print()">Print Ticket</button>

</div>

</div>

<script>

const savedData = localStorage.getItem("ticketData");

if (!savedData) {

    alert("Ticket information not found.");
    
} else {

    const ticket = JSON.parse(savedData);

    // DISPLAY TICKET DETAILS
    document.getElementById("bookingId").textContent =
        ticket.bookingId;

    document.getElementById("ticketName").textContent =
        ticket.name;

    document.getElementById("ticketSeats").textContent =
        ticket.seats.join(", ");

    document.getElementById("ticketBranch").textContent =
        ticket.branch;

    document.getElementById("ticketAmount").textContent =
        "₹" + Number(ticket.total).toLocaleString("en-IN");

    // CREATE QR DATA
    const qrData = `
Nrityanand Kathak Vidyalay

Booking ID: ${ticket.bookingId}

Name: ${ticket.name}

Seats: ${ticket.seats.join(", ")}

Phone: ${ticket.phone}

Branch: ${ticket.branch}

Date: 6 September 2026

Time: 7:00 PM

Hall: Prabodhankar Thackeray Auditorium

Amount: ₹${Number(ticket.total).toLocaleString("en-IN")}
`;

    const qrURL =
        "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data="
        + encodeURIComponent(qrData);

    document.getElementById("ticketQR").src = qrURL;

}

</script>

<script>

function createConfettiBurst() {

    const container = document.getElementById("confetti-container");

    const colors = [
        "#7b2cbf",   // Purple
        "#f24e6c",   // Pink
        "#25c77a",   // Green
        "#ffd166",   // Yellow
        "#ffffff",   // White
        "#4cc9f0",   // Blue
        "#ff8fab"    // Light Pink
    ];

    const numberOfPieces = 300;

    // CREATE CONFETTI
    for (let i = 0; i < numberOfPieces; i++) {

        // BOTTOM BURST
        createPiece("bottom");
    }

    function createPiece(side) {

        const piece = document.createElement("div");

        piece.classList.add("confetti-piece");
        piece.classList.add(side);

        // Random color
        piece.style.backgroundColor =
            colors[Math.floor(Math.random() * colors.length)];

        // START FROM BOTTOM
        piece.style.bottom =
            "0px";

        // Random horizontal position
        piece.style.left =
            (20 + Math.random() * 60) + "vw";

        // Random burst distance
        const distanceX =
            -500 + Math.random() * 1000;

        const distanceY =
            -(200 + Math.random() * 600);

        // Horizontal movement

        piece.style.setProperty(
            "--x",
            distanceX + "px"
        );

        // Vertical movement

        piece.style.setProperty(
            "--y",
            distanceY + "px"
        );

        // Random rotation

        piece.style.setProperty(
            "--rotation",
            (Math.random() * 1440 - 720) + "deg"
        );

        // Different animation speeds

        piece.style.animationDuration =
            (2 + Math.random() * 1.5) + "s";

        // Slightly different delays

        piece.style.animationDelay =
            (Math.random() * 0.35) + "s";

        container.appendChild(piece);

        // Remove after animation

        setTimeout(() => {

            piece.remove();

        }, 4000);
    }
}
// START WHEN PAGE LOADS

window.addEventListener("load", () => {

    setTimeout(() => {

        createConfettiBurst();

    }, 300);

});

</script>

</body>
</html>
