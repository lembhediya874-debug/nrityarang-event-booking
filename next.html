<style>

    .header{

    .seat-container {

  .svg-wraper {

  svg circle.seat {

<body>

     <section class="hero">

    <div class="seat-container">

    <div class="seat-controls">

        <div class="seat-title">Selected Seats</div>
        <div id="seatCountText">Seat(s) None</div>
        <div id="totalSeats">Total Seats:0</div>
        <div id="totalAmount">Total Amount: ₹0</div>
    </div>

    <div class="available-seats">
    <div class="available-title">Available Seats</div>
    <div id="availableSeats">0</div>
    </div>

    <div class="booking-section">
    <button id="bookBtn" class="book-btn">
        Book Tickets
    </button>

    <script>
      const API_URL = "https://nrityarang-event-booking.onrender.com";

      // Create or retrieve the user's session ID
      let userSessionId = localStorage.getItem("userSessionId");

      if (!userSessionId) {
        userSessionId = crypto.randomUUID();

        localStorage.setItem(
          "userSessionId",
          userSessionId
        );
      }

console.log("User Session ID:", userSessionId);

  const rowSpecs = [
    // TOP TIER
    { label: "CC", left: 10, center: 18, right: 10 },
    { label: "BB", left: 10, center: 19, right: 10 },
    { label: "AA", left: 10, center: 18, right: 10 },
    { label: "Z",  left: 10, center: 19, right: 10 },
    { label: "Y",  left: 10, center: 18, right: 10 },
    { label: "X",  left: 10, center: 19, right: 10 },
    { label: "W",  left: 10, center: 18, right: 10 },
    { label: "V",  left: 10, center: 19, right: 10 },

    { type: "gap" },
    { type: "gap" },
    { type: "gap" },

    // MIDDLE TIER
    { label: "U", left: 12, center: 12, right: 12 },
    { label: "T", left: 13, center: 13, right: 13 },
    { label: "S", left: 13, center: 12, right: 13 },
    { label: "R", left: 13, center: 13, right: 13 },
    { label: "Q", left: 13, center: 12, right: 13 },
    { label: "P", left: 13, center: 13, right: 13 },
    { label: "O", left: 13, center: 12, right: 13 },
    { label: "N", left: 13, center: 13, right: 13 },

    { type: "gap" },
    { type: "gap" },

    // BOTTOM TIER
    { label: "M", left: 13, center: 12, right: 13 },
    { label: "L", left: 13, center: 13, right: 13 },
    { label: "K", left: 13, center: 12, right: 13 },
    { label: "J", left: 13, center: 13, right: 13 },
    { label: "H", left: 13, center: 12, right: 13 },
    { label: "G", left: 12, center: 13, right: 12 },
    { label: "F", left: 12, center: 12, right: 11 },
    { label: "E", left: 10, center: 13, right: 10 },
    { label: "D", left: 9,  center: 12, right: 9 },
    { label: "C", left: 9,  center: 13, right: 8 },
    { label: "B", left: 8,  center: 12, right: 8 },
    { label: "A", left: 7,  center: 13, right: 7 },

  ];

  const rowPrices = {
    CC : 250,
    BB : 250,
    AA : 250,
    Z : 250,
    Y : 250,
    X : 250,
    W : 250,
    V : 250,

    U : 350,
    T : 350,
    S : 350,

    R : 400,
    Q : 400,
    P : 400,
    O : 400,
    N : 400,

    M : 450,
    L : 450,
    K : 450,
    J : 450,

    H : 500,
    G : 500,
    F : 500,
    E : 500,
    D : 500,

    C : 0,
    B : 0,
    A : 0
  }

  const blockedRows = ["A", "B", "C"];

  const STORAGE_KEY = "auditorium_exact_image_matching_v1";

  let selectedSeats = [];

const BOOKED_SEATS_CACHE_KEY = "nrityarang_booked_seats";

let bookedSeats = [];
let heldSeats = [];

try {
    bookedSeats = JSON.parse(
        localStorage.getItem(BOOKED_SEATS_CACHE_KEY) || "[]"
    );
} catch (error) {
    console.error("Booked seats cache error:", error);
    bookedSeats = [];
}
  //let heldSeats = [];

  function isSeatUnavailable(seatId) {
    return bookedSeats.includes(seatId) ||
           heldSeats.includes(seatId);
}

  const svg = document.getElementById("seatSvg");
  const seatCountText = document.getElementById("seatCountText");
  const availableSeats = document.getElementById("availableSeats");
  const totalSeats = document.getElementById("totalSeats");
  const bookBtn = document.getElementById("bookBtn");
  const totalAmount = document.getElementById("totalAmount");


  // DRAW AUDITORIUM
// =====================================================
// DRAW AUDITORIUM
// =====================================================

function drawAuditorium() {

    svg.innerHTML = "";

    let currentY = 24;

    let previousPrice = null;

    const LEFT_RIGHT_EDGE = 250;
    const CENTER_RIGHT_EDGE = 570;
    const RIGHT_RIGHT_EDGE = 755;

    const seatSpacing = 16;

    // =====================================================
// PRICE LABEL
// =====================================================

function drawPriceLabel(y, price) {

    if (price === undefined || price === null) return;

    const NS = "http://www.w3.org/2000/svg";

    // RIGHT PRICE
    const rightPrice = document.createElementNS(
        NS,
        "text"
    );

    rightPrice.setAttribute("x", "790");
    rightPrice.setAttribute("y", y);

    rightPrice.setAttribute(
        "class",
        "price-label"
    );

    rightPrice.textContent = `₹${price}`;

    svg.appendChild(rightPrice);
}

// THIN PRICE SECTION LINE

function drawPriceLine(y) {

    const NS = "http://www.w3.org/2000/svg";

    // LEFT SIDE LINE
    const leftLine = document.createElementNS(
        NS,
        "line"
    );

    leftLine.setAttribute("x1", "45");
    leftLine.setAttribute("y1", y);

    leftLine.setAttribute("x2", "225");
    leftLine.setAttribute("y2", y);

    leftLine.setAttribute(
        "class",
        "price-line"
    );

    svg.appendChild(leftLine);


    // RIGHT SIDE LINE
    const rightLine = document.createElementNS(
        NS,
        "line"
    );

    rightLine.setAttribute("x1", "610");
    rightLine.setAttribute("y1", y);

    rightLine.setAttribute("x2", "825");
    rightLine.setAttribute("y2", y);

    rightLine.setAttribute(
        "class",
        "price-line"
    );

    svg.appendChild(rightLine);
}

    const NS = "http://www.w3.org/2000/svg";


    // =====================================================
    // HELPER: DRAW PRICE LABEL ON BOTH SIDES
    // =====================================================

    function drawPriceLabel(y, price) {

        if (price === undefined || price === null) return;

        // RIGHT PRICE
        const rightPrice = document.createElementNS(NS, "text");

        rightPrice.setAttribute("x", "800");
        rightPrice.setAttribute("y", y + 3);
        rightPrice.setAttribute("class", "price-label");
        rightPrice.setAttribute("text-anchor", "middle");

        rightPrice.textContent = `₹${price}`;

        svg.appendChild(rightPrice);
    }

    // =====================================================
    // HELPER: DRAW THIN PRICE SEPARATOR
    // =====================================================

    function drawPriceLine(y) {

        const line = document.createElementNS(NS, "line");

        line.setAttribute("x1", "45");
        line.setAttribute("y1", y);

        line.setAttribute("x2", "805");
        line.setAttribute("y2", y);

        line.setAttribute("class", "price-line");

        svg.appendChild(line);
    }

    rowSpecs.forEach((row) => {

    if (row.type !== "gap") {

    const currentPrice = rowPrices[row.label];

    // Do not show price for blocked rows
    if (!blockedRows.includes(row.label)) {

        // Price changed
        if (currentPrice !== previousPrice) {

            // Separator before new section
            if (previousPrice !== null) {
                drawPriceLine(currentY - 10);
            }

            // Price on BOTH sides
            drawPriceLabel(currentY, currentPrice);

            previousPrice = currentPrice;
        }
    }
}

        const leftLabel = document.createElementNS(
            NS,
            "text"
        );

        leftLabel.setAttribute("x", "25");
        leftLabel.setAttribute("y", currentY);
        leftLabel.setAttribute("class", "row-label");

        leftLabel.textContent = row.label;

        svg.appendChild(leftLabel);


        // =================================================
        // ROW LABEL - RIGHT
        // =================================================

        const rightLabel = document.createElementNS(
            NS,
            "text"
        );

        rightLabel.setAttribute("x", "825");
        rightLabel.setAttribute("y", currentY);
        rightLabel.setAttribute("class", "row-label");

        rightLabel.textContent = row.label;

        svg.appendChild(rightLabel);


        // =================================================
        // SEAT NUMBER
        // =================================================

        let seatNumber = 1;


        function drawBlock(startOrEnd, count, alignRight = true) {

            if (count <= 0) return;


            for (let i = 0; i < count; i++) {

                let x;


                if (alignRight) {

                    // Seats grow towards LEFT
                    x =
                        startOrEnd -
                        ((count - 1 - i) * seatSpacing);

                } else {

                    // Seats grow towards RIGHT
                    x =
                        startOrEnd +
                        (i * seatSpacing);
                }


                const id =
                    `${row.label}-${String(seatNumber).padStart(2, "0")}`;

                const num = seatNumber;


                // =============================================
                // SEAT CIRCLE
                // =============================================

                const circle = document.createElementNS(
                    NS,
                    "circle"
                );

                circle.setAttribute("cx", x);
                circle.setAttribute("cy", currentY);
                circle.setAttribute("r", 6.5);


                let stateClass = "seat";


                if (blockedRows.includes(row.label)) {

                    stateClass += " blocked";

                }
                else if (bookedSeats.includes(id)) {

                    stateClass += " booked";

                }
                else if (heldSeats.includes(id)) {

                    stateClass += " held";

                }
                else if (selectedSeats.includes(id)) {

                    stateClass += " selected";
                }


                circle.setAttribute("class", stateClass);

                circle.setAttribute(
                    "data-seat-id",
                    id
                );


                // =============================================
                // SEAT CLICK
                // =============================================

                circle.addEventListener("click", () => {

                    if (blockedRows.includes(row.label)) {
                        return;
                    }


                    if (isSeatUnavailable(id)) {
                        return;
                    }


                    if (selectedSeats.includes(id)) {

                        selectedSeats =
                            selectedSeats.filter(
                                s => s !== id
                            );

                    } else {

                        selectedSeats.push(id);
                    }


                    drawAuditorium();

                    updateUI();

                });


                svg.appendChild(circle);


                // =============================================
                // SEAT NUMBER TEXT
                // =============================================

                const text = document.createElementNS(
                    NS,
                    "text"
                );

                text.setAttribute("x", x);
                text.setAttribute("y", currentY);
                text.setAttribute("class", "seat-text");

                text.textContent = num;

                svg.appendChild(text);


                seatNumber++;
            }
        }


        // =====================================================
        // LEFT BLOCK
        // =====================================================

        drawBlock(
            LEFT_RIGHT_EDGE,
            row.left,
            true
        );


        // =====================================================
        // CENTER BLOCK
        // =====================================================

        let centreEdge = CENTER_RIGHT_EDGE;


        if (
            [
                "U", "T", "S",
                "R", "Q", "P", "O", "N",
                "M", "L", "K", "J",
                "H", "G", "F", "E", "D",
                "C", "B", "A"
            ].includes(row.label)
        ) {

            centreEdge = 500;
        }


        drawBlock(
            centreEdge,
            row.center,
            true
        );

        // RIGHT BLOCK

        if (
            [
                "M", "L", "K", "J",
                "H", "G", "F", "E", "D",
                "C", "B", "A"
            ].includes(row.label)
        ) {

            drawBlock(
                580,
                row.right,
                false
            );

        } else {

            drawBlock(
                RIGHT_RIGHT_EDGE,
                row.right,
                true
            );
        }

        // MOVE TO NEXT ROW

        currentY += 21;

    });

    // BALCONY LINE

    const balconyText = document.createElementNS(
        NS,
        "text"
    );

    balconyText.setAttribute("x", "425");
    balconyText.setAttribute("y", "210");
    balconyText.setAttribute("text-anchor", "middle");
    balconyText.setAttribute("font-size", "20");
    balconyText.setAttribute("font-family", "Arial");
    balconyText.setAttribute("font-weight", "bold");
    balconyText.setAttribute("fill", "white");

    balconyText.textContent =
        "-----------------------------------------↑ BALCONY ↑------------------------------------------";

    svg.appendChild(balconyText);

    // FINAL SVG HEIGHT

    svg.setAttribute(
        "viewBox",
        `0 0 870 ${currentY + 20}`
    );
}
    // SVG SIZE

    function updateUI() {

    const sortedSeats = [...selectedSeats].sort();

    // Selected seats
    seatCountText.textContent =
        `Seat(s) ${
            sortedSeats.length
                ? sortedSeats.join(", ")
                : "None"
        }`;

    // Total seats currently selected
    totalSeats.innerHTML =
        `Total Seats: <span>${selectedSeats.length}</span>`;

    // Total number of seats in the entire hall
    const totalHallSeats = rowSpecs.reduce((total, row) => {

    if (row.type === "gap") {
        return total;
    }

    if (blockedRows.includes(row.label)) {
        return total;
    }

    return total + row.left + row.center + row.right;

    }, 0);

    // Available seats = total hall seats - already booked seats
    const unavailableCount =
      bookedSeats.length + heldSeats.length;

    const availableCount =
      totalHallSeats - unavailableCount;

    availableSeats.textContent = availableCount;

    //total amount
    const totalAmountValue = selectedSeats.reduce((total, seat) => {

    const row = seat.split("-")[0];

    return total + rowPrices[row];

    }, 0);

    totalAmount.innerHTML =
        `Total Amount: <span>₹${totalAmountValue.toLocaleString("en-IN")}</span>`;

    // Enable/disable Book Tickets button
    bookBtn.disabled = selectedSeats.length === 0;
  }

// LOAD BOOKED SEATS FROM BACKEND
async function loadBookedSeats() {

    try {

        const response = await fetch(
            `${API_URL}/api/booked-seats`,
            {
                method: "GET",
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error(
                `Server returned ${response.status}`
            );
        }

        const data = await response.json();

        console.log(
            "Latest booked seats:",
            data.bookedSeats
        );

        console.log(
            "Latest held seats:",
            data.heldSeats
        );

        // UPDATE CONFIRMED SEATS

        bookedSeats = data.bookedSeats || [];

        // UPDATE HOLD SEATS

        heldSeats = data.heldSeats || [];

        // SAVE CONFIRMED SEATS TO CACHE

        localStorage.setItem(
            BOOKED_SEATS_CACHE_KEY,
            JSON.stringify(bookedSeats)
        );

        // UPDATE DISPLAY

        updateBookedSeatDisplay();

        updateUI();

    } catch (error) {

        console.error(
            "Could not update booked seats:",
            error
        );

        // Keep cached confirmed seats
        updateBookedSeatDisplay();

        updateUI();
    }
}

// Automatically check for newly booked/held seats
setInterval(() => {
    loadBookedSeats();
}, 3000);

function updateBookedSeatDisplay() {

    const allSeats = document.querySelectorAll(
        "circle.seat"
    );

    allSeats.forEach(circle => {

        const seatId =
            circle.getAttribute("data-seat-id");

        if (!seatId) return;

        const row = seatId.split("-")[0];

        // Do not change blocked seats
        if (blockedRows.includes(row)) {
            return;
        }

        // Remove old state classes
        circle.classList.remove(
            "booked",
            "held",
            "selected"
        );

        // CONFIRMED

        if (bookedSeats.includes(seatId)) {

            circle.classList.add("booked");

            // Remove from local selection
            selectedSeats =
                selectedSeats.filter(
                    seat => seat !== seatId
                );

        }
        // TEMPORARY HOLD

        else if (heldSeats.includes(seatId)) {

            circle.classList.add("held");

            // Remove from local selection
            selectedSeats =
                selectedSeats.filter(
                    seat => seat !== seatId
                );

        }

        // LOCALLY SELECTED

        else if (selectedSeats.includes(seatId)) {

            circle.classList.add("selected");

        }

    });

    updateUI();
}
  async function releaseSeatHold(orderId) {

    if (!orderId) {
        console.log("No order ID found. Nothing to release.");
        return;
    }

    try {

        const response = await fetch(
            `${API_URL}/api/release-seats`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                keepalive: true,
                body: JSON.stringify({
                    order_id: orderId
                })
            }
        );

        const data = await response.json();

        console.log("Release seat response:", data);

    } catch (error) {

        console.error(
            "Failed to release seats:",
            error
        );
    }
}

  // BOOK BUTTON

bookBtn.addEventListener("click", async () => {

    if (selectedSeats.length === 0) {
        alert("Please select at least one seat.");
        return;
    }

    try {

        bookBtn.disabled = true;
        bookBtn.textContent = "Checking seats...";

        // Get latest seat status
        const seatResponse = await fetch(
            `${API_URL}/api/booked-seats`,
            {
                method: "GET",
                cache: "no-store"
            }
        );

        if (!seatResponse.ok) {
            throw new Error("Unable to check latest seat availability.");
        }

        const seatData = await seatResponse.json();

        bookedSeats = seatData.bookedSeats || [];
        heldSeats = seatData.heldSeats || [];

        // Save confirmed seats
        localStorage.setItem(
            BOOKED_SEATS_CACHE_KEY,
            JSON.stringify(bookedSeats)
        );

        // Check whether selected seats became unavailable
        const unavailableSelectedSeats =
            selectedSeats.filter(seat =>
                bookedSeats.includes(seat) ||
                heldSeats.includes(seat)
            );

        if (unavailableSelectedSeats.length > 0) {

            selectedSeats = selectedSeats.filter(
                seat => !unavailableSelectedSeats.includes(seat)
            );

            drawAuditorium();
            updateUI();

            alert(
                "The following seat(s) are no longer available:\n\n" +
                unavailableSelectedSeats.join(", ") +
                "\n\nPlease select different seats."
            );

            bookBtn.disabled = selectedSeats.length === 0;
            bookBtn.textContent = "Book Tickets";

            return;
        }

        // ==========================================
        // CREATE RAZORPAY ORDER
        // ==========================================

        bookBtn.textContent = "Creating Order...";

        const response = await fetch(
            `${API_URL}/api/create-order`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    seats: selectedSeats,
                    session_id: userSessionId
                })
            }
        );

        const data = await response.json();

        console.log("Create order response:", data);

        if (!response.ok) {
            throw new Error(
                data.error || "Unable to create order"
            );
        }

        const orderId = data.id;
        const total = data.calculatedPrice;

        if (!orderId) {
            throw new Error(
                "Razorpay Order ID was not received."
            );
        }

        // GO TO PAYMENT PAGE

        window.location.href =
            `payment.html?seats=${encodeURIComponent(
                selectedSeats.join(",")
            )}` +
            `&orderId=${encodeURIComponent(orderId)}` +
            `&total=${encodeURIComponent(total)}`;

    } catch (error) {

        console.error("Create order error:", error);

        alert(error.message);

        bookBtn.disabled = false;
        bookBtn.textContent = "Book Tickets";
    }
});

drawAuditorium();
updateUI();

loadBookedSeats();

</script>
    
    <footer>
        <p>Tickets Cancellation not allowed</p>
    </footer>

</div>
</body>
